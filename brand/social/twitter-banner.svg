<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500" role="img" aria-label="weathership">
  <title>weathership</title>
  <rect width="1500" height="500" fill="#0E1726"/>

  <!-- subtle horizon stripe -->
  <rect x="0" y="332" width="1500" height="2" fill="#3A4A5E"/>

  <!-- repeating chevron pattern at right edge — wind/weather hint -->
  <g fill="none" stroke="#3A4A5E" stroke-width="2" opacity="0.8">
    <path d="M 1100 180 L 1140 140 L 1180 180"/>
    <path d="M 1180 200 L 1220 160 L 1260 200"/>
    <path d="M 1260 220 L 1300 180 L 1340 220"/>
    <path d="M 1340 240 L 1380 200 L 1420 240"/>
    <path d="M 1420 260 L 1460 220 L 1500 260"/>
  </g>

  <!-- mark, large at left -->
  <g transform="translate(120, 176) scale(6.5)">
    <polygon points="12,2 19,10 5,10" fill="#E8B14A"/>
    <rect x="3" y="11" width="18" height="2" fill="#F7F5EE"/>
    <polygon points="5,14 19,14 12,22" fill="#F7F5EE"/>
  </g>

  <!-- wordmark + single italic tagline -->
  <text x="320" y="280" font-family="Inter, 'Inter Fallback', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="96" fill="#F7F5EE" letter-spacing="-1.9">weathership</text>
  <text x="320" y="328" font-family="Inter, 'Inter Fallback', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="28" font-style="italic" fill="#D6D2C4" letter-spacing="-0.2">we who saw the deep.</text>
</svg>
