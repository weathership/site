name: deploy

# Push to main → deploy to dev (weathership.zndx.org).
# Production releases (weathership.org) are gated behind a manual
# workflow_dispatch with `target: production` so prod is never the
# default outcome of a merge.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "brand/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target"
        type: choice
        options: [dev, production]
        default: dev

concurrency:
  group: cloudflare-deploy-${{ github.event.inputs.target || 'dev' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: web
        run: pnpm typecheck

      - name: Deploy to dev (weathership.zndx.org)
        if: github.event.inputs.target != 'production'
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm run deploy:dev

      - name: Release to production (weathership.org)
        if: github.event.inputs.target == 'production'
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm run deploy:prod
